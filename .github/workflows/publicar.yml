# Publica la web en GitHub Pages cada vez que se suben cambios a la rama main.
# Antes de compilar revisa que las dependencias no tengan vulnerabilidades altas
# y que el catálogo (126 productos y precios) no haya cambiado.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Revisar vulnerabilidades
        run: npm audit --audit-level=high
      - name: Revisar que el catálogo no cambió
        run: node scripts/inventario.mjs comparar docs/inventario-antes.json
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
